name: CI

# docs/ has its own workflow and its own lockfile — it is not part of the root pnpm
# project, so nothing under it can change what the build, the PHP suites or the browser
# tests see. .wordpress-org/ is Directory listing artwork, served from SVN and never
# built. Skipping both keeps a copy-edit from spending a full matrix.
on:
  push:
    branches: [main]
    paths-ignore: &non_code_paths
      - 'docs/**'
      - '.wordpress-org/**'
      - 'README.md'
      # Named one by one rather than as '.github/**', because this workflow and the
      # reusable suite it calls must keep triggering on their own edits — a CI change
      # that has never run is a CI change nobody has tested. The siblings below define
      # runs this one does not perform, so they add no signal here. A new workflow file
      # triggers CI until someone adds it here on purpose.
      - '.github/dependabot.yml'
      - '.github/workflows/docs.yml'
      - '.github/workflows/plugin-check.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/wporg-assets.yml'
  pull_request:
    paths-ignore: *non_code_paths

# A newer push to the same branch makes the in-flight run obsolete. main is
# exempt so every commit that lands keeps a complete, attributable result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    # Dependabot only bumps pinned deps/actions; skip the full CI matrix on its
    # PRs. Pushes to main (post-merge) still run — github.actor is the merger there.
    if: github.actor != 'dependabot[bot]'
    uses: ./.github/workflows/checks.yml
    with:
      # The e2e suite is the slowest job by a wide margin, and the push event that
      # follows a merge re-runs it over code the pull request already cleared. Keep
      # it on pull requests, where it can still block a merge; release.yml runs the
      # full suite again on the tag, so nothing ships without it.
      e2e: ${{ github.event_name == 'pull_request' }}
