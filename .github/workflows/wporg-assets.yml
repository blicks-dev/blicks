name: WordPress.org assets

# The Directory listing — banners, icons, screenshots — is served from SVN, not from
# the plugin zip. Without this, replacing a banner would mean cutting a whole release.
#
# readme.txt is deliberately NOT synced on push. It carries `Stable tag:`, so a version
# bump merged to main would publish "the stable version is X" to trunk before tags/X
# exists. The release deploy pushes readme.txt to trunk and the tag together instead.
# For a copy-only readme fix, run this workflow by hand.
on:
  push:
    branches: [main]
    paths:
      - '.wordpress-org/**'
  workflow_dispatch:

jobs:
  assets:
    name: Sync listing assets to SVN
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The plugin has no SVN repository until WordPress.org approves the
      # submission, and the action fails hard on missing credentials. Skip with a
      # notice instead, so this workflow is not permanently red before then.
      - name: Check for SVN credentials
        id: creds
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
        run: |
          if [ -z "$SVN_USERNAME" ]; then
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo '::notice::SVN_USERNAME is not set — skipping the asset sync.'
          else
            echo 'present=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Update the Directory listing
        if: steps.creds.outputs.present == 'true'
        uses: 10up/action-wordpress-plugin-asset-update@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: blicks
          ASSETS_DIR: .wordpress-org
