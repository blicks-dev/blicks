name: Plugin Check

# The WordPress.org Plugin Directory runs these same checks on submission and on
# every update. Running them here means a rejection shows up on the pull request
# rather than after a tag has been pushed.
#
# Denylist, not an allowlist, and deliberately so: it mirrors `scripts/bundle.js`, which
# assembles the zip from an explicit allowlist. Anything not listed below is assumed to
# reach the zip, so adding a new source directory keeps the check running by default. The
# paths here cannot: none of them is in the bundle allowlist.
on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'tests/**'
      - '.wordpress-org/**'
      - '.playground/**'
      - '.githooks/**'
      - 'README.md'
      # Every workflow except this one. Editing plugin-check.yml still re-runs the
      # check against the change; editing an unrelated workflow does not rebuild a zip.
      - '.github/dependabot.yml'
      - '.github/workflows/checks.yml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/docs.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/wporg-assets.yml'
  workflow_dispatch:

concurrency:
  group: plugin-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin-check:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer, wp-cli
          coverage: none

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      # Checks the zip the user actually installs, not the repo: `pnpm bundle`
      # builds, generates translations, installs production Composer deps and
      # assembles from an explicit allowlist.
      - name: Bundle
        run: pnpm bundle

      - name: Unpack
        run: unzip -q dist/blicks.zip -d plugin-check-build

      - name: Plugin Check
        uses: WordPress/plugin-check-action@v1
        with:
          build-dir: plugin-check-build/blicks
